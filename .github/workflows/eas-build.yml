name: EAS Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: false
        default: 'preview'
        type: choice
        options: [preview, production]

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    outputs:
      project_id: ${{ steps.check.outputs.project_id }}
      profile: ${{ steps.check.outputs.profile }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate prerequisites
        id: check
        run: |
          set -e

          PROFILE="${{ github.event.inputs.profile || 'preview' }}"
          echo "profile=$PROFILE" >> "$GITHUB_OUTPUT"

          # Check EXPO_TOKEN secret is set
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "::error::EXPO_TOKEN secret is not set."
            echo "::error::Go to https://expo.dev/accounts/[account]/settings/access-tokens"
            echo "::error::Generate a token and add it as a GitHub secret named EXPO_TOKEN."
            exit 1
          fi

          # Read EAS project ID from app.json
          APP_JSON="artifacts/islamnashra/app.json"
          PROJECT_ID=$(node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('$APP_JSON','utf8'));
            const id = cfg?.expo?.extra?.eas?.projectId ?? '';
            process.stdout.write(id);
          ")

          if [ -z "$PROJECT_ID" ] || [ "$PROJECT_ID" = "YOUR_EAS_PROJECT_ID" ]; then
            echo "::error::EAS project ID is not configured in artifacts/islamnashra/app.json."
            echo "::error::Steps to fix:"
            echo "::error::  1. Go to https://expo.dev and create a free project."
            echo "::error::  2. Copy the Project ID."
            echo "::error::  3. In app.json set: extra.eas.projectId = '<your-project-id>'"
            echo "::error::  4. Also set the slug in eas.json matches your expo.dev project slug."
            exit 1
          fi

          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "✅ EAS project ID: $PROJECT_ID"
          echo "✅ Build profile:  $PROFILE"

      - name: Validate eas.json exists
        run: |
          if [ ! -f "artifacts/islamnashra/eas.json" ]; then
            echo "::error::artifacts/islamnashra/eas.json not found."
            exit 1
          fi
          echo "✅ eas.json found"

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: preflight
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://qyrkrmxggorpbcbjxihp.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.store }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install EAS CLI
        run: npm install -g eas-cli@latest

      - name: Authenticate with Expo
        run: eas whoami
        working-directory: artifacts/islamnashra

      - name: Set EAS project (ensure correct project is linked)
        working-directory: artifacts/islamnashra
        run: |
          PROJECT_ID="${{ needs.preflight.outputs.project_id }}"
          # Update app.json to have the correct project ID (in case placeholder slipped through)
          node -e "
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('app.json','utf8'));
            cfg.expo.extra = cfg.expo.extra ?? {};
            cfg.expo.extra.eas = cfg.expo.extra.eas ?? {};
            cfg.expo.extra.eas.projectId = '$PROJECT_ID';
            fs.writeFileSync('app.json', JSON.stringify(cfg, null, 2));
          "
          echo "✅ Project ID confirmed: $PROJECT_ID"

      - name: Build Android APK (EAS Build)
        id: eas_build
        working-directory: artifacts/islamnashra
        run: |
          set -o pipefail

          PROFILE="${{ needs.preflight.outputs.profile }}"
          echo "Starting EAS build with profile: $PROFILE"

          # Run eas build and capture output (including the build URL)
          BUILD_OUTPUT=$(eas build \
            --platform android \
            --profile "$PROFILE" \
            --non-interactive \
            --json \
            2>&1 | tee /tmp/eas-build.log) || BUILD_EXIT=$?

          # Try to extract build URL from JSON output
          BUILD_URL=$(echo "$BUILD_OUTPUT" | node -e "
            const lines = require('fs').readFileSync('/dev/stdin','utf8').split('\n');
            for (const line of lines) {
              try {
                const parsed = JSON.parse(line);
                if (Array.isArray(parsed) && parsed[0]?.buildDetailsPageUrl) {
                  process.stdout.write(parsed[0].buildDetailsPageUrl);
                  break;
                }
              } catch {}
            }
          " 2>/dev/null || true)

          # Fallback: extract URL from plain text log
          if [ -z "$BUILD_URL" ]; then
            BUILD_URL=$(grep -oE 'https://expo\.dev/accounts/[^/]+/projects/[^/]+/builds/[a-f0-9-]+' /tmp/eas-build.log | head -1 || true)
          fi

          if [ -n "$BUILD_URL" ]; then
            echo "build_url=$BUILD_URL" >> "$GITHUB_OUTPUT"
            echo "✅ Build submitted: $BUILD_URL"
          fi

          # Exit with original build exit code
          exit ${BUILD_EXIT:-0}

      - name: Post build URL as job summary
        if: always() && steps.eas_build.outputs.build_url != ''
        run: |
          BUILD_URL="${{ steps.eas_build.outputs.build_url }}"
          PROFILE="${{ needs.preflight.outputs.profile }}"
          {
            echo "## 📱 EAS Build Submitted"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Profile** | \`$PROFILE\` |"
            echo "| **Platform** | Android |"
            echo "| **Build Page** | [$BUILD_URL]($BUILD_URL) |"
            echo "| **Commit** | \`${{ github.sha }}\` |"
            echo ""
            echo "> The APK download link appears on the build page once the build completes (typically 10–20 minutes)."
            echo "> For \`preview\` profile builds, the APK is available directly for download."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Self-heal — diagnose and fix build errors
        if: failure()
        working-directory: artifacts/islamnashra
        run: |
          echo "=== Build failed. Diagnosing... ==="
          LOG=/tmp/eas-build.log

          # ── Common fixable issues ────────────────────────────────────────────

          if grep -qi "EXPO_TOKEN" "$LOG" 2>/dev/null; then
            echo "::error::EXPO_TOKEN is invalid or expired."
            echo "::error::Regenerate at https://expo.dev/accounts/[account]/settings/access-tokens"
            echo "::error::and update the GitHub secret EXPO_TOKEN."
          fi

          if grep -qi "project not found\|invalid project" "$LOG" 2>/dev/null; then
            echo "::error::EAS project not found. Ensure the project ID in app.json matches your expo.dev project."
            echo "::error::Also verify the 'slug' in app.json matches the project slug on expo.dev."
          fi

          if grep -qi "android.*package.*already" "$LOG" 2>/dev/null; then
            echo "::warning::Android package name conflict. The package 'com.digitalxnews.islamnashra' may already be taken on Google Play."
            echo "::warning::Change android.package in app.json if needed."
          fi

          if grep -qi "version.*sdk.*mismatch\|sdk version" "$LOG" 2>/dev/null; then
            echo "::error::Expo SDK version mismatch. Run 'npx expo install --check' locally to fix."
          fi

          if grep -qi "out of memory\|OOM" "$LOG" 2>/dev/null; then
            echo "::error::Build ran out of memory on Expo's servers. This is a transient error — re-run the workflow."
          fi

          if grep -qi "network error\|ENOTFOUND\|ETIMEDOUT" "$LOG" 2>/dev/null; then
            echo "::error::Network error during build. Re-run the workflow — this is typically transient."
          fi

          # Print last 50 lines of build log for diagnosis
          echo ""
          echo "=== Last 50 lines of build output ==="
          tail -50 "$LOG" || true

          echo ""
          echo "=== Manual steps if auto-diagnosis didn't find the issue ==="
          echo "1. Check the build URL above for full Expo build logs."
          echo "2. For signing issues: set up Android Keystore in EAS secrets (eas credentials)."
          echo "3. For FCM push on standalone APK: add google-services.json via 'eas secret:create'."
          echo "   See: https://docs.expo.dev/push-notifications/fcm-credentials/"

  notify-success:
    name: Build Complete Notification
    runs-on: ubuntu-latest
    needs: [preflight, build]
    if: success()
    steps:
      - name: Summary
        run: |
          {
            echo "## ✅ EAS Build Succeeded"
            echo ""
            echo "The Android build has been submitted to EAS."
            echo "Check the build page linked above for the APK download once it completes."
          } >> "$GITHUB_STEP_SUMMARY"
